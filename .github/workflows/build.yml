name: Build OMPlayer

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Android APK ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name omplayer

      - name: Debug Android config
        run: |
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== android/app/build.gradle (sdk lines) ==="
          grep -n -E "compileSdk|minSdk|targetSdk|flutter" android/app/build.gradle

      - name: Fix Android build config
        run: |
          # 1. 修复 app/build.gradle 中的 SDK 版本
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/g' android/app/build.gradle
          sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 35/g' android/app/build.gradle

          # 2. 在 android/build.gradle 中添加 ext.flutter 定义，供插件使用
          cat > /tmp/flutter_ext.gradle << 'EOF'
          ext.flutter = [
              minSdkVersion   : 21,
              targetSdkVersion: 35,
              compileSdkVersion: 35
          ]
          EOF
          # 在 build.gradle 开头插入 ext 定义
          sed -i '1r /tmp/flutter_ext.gradle' android/build.gradle

          # 3. 显示修复后的配置
          echo "=== Fixed android/build.gradle ==="
          head -20 android/build.gradle
          echo ""
          echo "=== Fixed SDK lines ==="
          grep -n -E "compileSdk|minSdk|targetSdk" android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk

  # ==================== Web ====================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Web project files
        run: flutter create . --platforms=web --project-name omplayer

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  # ==================== Windows Desktop ====================
  build-windows:
    name: Build Windows
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Windows project files
        run: flutter create . --platforms=windows --project-name omplayer

      - name: Debug Windows CMake
        run: |
          echo "=== windows/CMakeLists.txt ==="
          Get-Content windows/CMakeLists.txt | Select-Object -First 10

      - name: Fix Windows CMake generator
        run: |
          # 将 CMake 生成器从 VS 2019 改为 VS 2022
          $cmakeFile = "windows/CMakeLists.txt"
          $content = Get-Content $cmakeFile -Raw
          $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
          Set-Content -Path $cmakeFile -Value $content -NoNewline
          # 验证修改
          echo "=== After fix ==="
          Get-Content $cmakeFile | Select-Object -First 10

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          # 清理可能存在的旧构建缓存
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OMPlayer-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: OMPlayer-windows.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMPlayer-windows.zip

  # ==================== macOS Desktop ====================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create macOS project files
        run: flutter create . --platforms=macos --project-name omplayer

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip macOS build
        run: cd build/macos/Build/Products/Release && zip -r OMPlayer-macos.zip OMPlayer.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/OMPlayer-macos.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/OMPlayer-macos.zip
