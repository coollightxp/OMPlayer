name: Build OMPlayer

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Android APK ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name omplayer

      - name: Patch Android config (cleartext HTTP / cutout fullscreen / PiP)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # IPTV 源多为 http:// 明文地址，必须允许明文流量
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          # 显式声明网络权限（video_player 会合并，但显式更稳）
          grep -q "android.permission.INTERNET" $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' $MANIFEST
          # 声明支持画中画（Android 8+ 系统级小窗）
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n                android:supportsPictureInPicture="true"|' $MANIFEST
          # 自定义 MainActivity：画中画 MethodChannel + Home 键自动小窗
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/example/omplayer
          cat > android/app/src/main/kotlin/com/example/omplayer/MainActivity.kt <<'KT'
          package com.example.omplayer

          import android.app.PictureInPictureParams
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var pipChannel: MethodChannel? = null
              private var autoPip = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  pipChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "omplayer/pip")
                  pipChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isPipSupported" -> result.success(isPipSupported())
                          "enterPip" -> {
                              if (isPipSupported()) {
                                  val params = PictureInPictureParams.Builder()
                                      .setAspectRatio(Rational(16, 9))
                                      .build()
                                  enterPictureInPictureMode(params)
                                  result.success(true)
                              } else {
                                  result.success(false)
                              }
                          }
                          "setAutoPip" -> {
                              autoPip = call.argument<Boolean>("enabled") ?: false
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun isPipSupported(): Boolean =
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      packageManager.hasSystemFeature(PackageManager.FEATURE_PICTURE_IN_PICTURE)

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (autoPip && isPipSupported()) {
                      val params = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(16, 9))
                          .build()
                      enterPictureInPictureMode(params)
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  pipChannel?.invokeMethod("pipChanged", isInPictureInPictureMode)
              }
          }
          KT
          # 挖孔/刘海屏全屏不留黑边
          mkdir -p android/app/src/main/res/values-v28
          cat > android/app/src/main/res/values-v28/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          XML

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk

  # ==================== Web ====================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create Web project files
        run: flutter create . --platforms=web --project-name omplayer

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Zip Web build
        run: |
          cd build/web
          zip -r ../../OMPlayer-web.zip .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMPlayer-web.zip

  # ==================== Windows Desktop ====================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.47+: Impeller 是 Windows 默认渲染器。Skia 下 fvp 视频外部纹理
          # 在程序化窗口缩放（迷你窗恢复）后合成发灰白；换用 Impeller 的
          # 全新外部纹理实现规避该问题
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Create Windows project files
        run: flutter create . --platforms=windows --project-name omplayer

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OMPlayer-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: OMPlayer-windows.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMPlayer-windows.zip

  # ==================== Linux Desktop ====================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev pkg-config

      - name: Create Linux project files
        run: flutter create . --platforms=linux --project-name omplayer

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Zip Linux build
        run: |
          cd build/linux/x64/release/bundle
          zip -r ${{ github.workspace }}/OMPlayer-linux.zip .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: OMPlayer-linux.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMPlayer-linux.zip
