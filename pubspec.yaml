name: omplayer
description: A cross-platform Flutter live streaming media player.
publish_to: 'none'
version: 1.1.003+2003

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 视频播放 - 支持 HLS/DASH 直播流，跨平台
  video_player: ^2.8.6
  video_player_android: ^2.4.16
  video_player_avfoundation: ^2.6.1
  video_player_web: ^2.3.1

  # Windows/Linux 视频播放后端（video_player 官方不支持桌面，fvp 基于 MDK 提供实现）
  fvp: ^0.38.1

  # 状态管理
  provider: ^6.1.2

  # 屏幕亮度控制（Android/iOS/macOS/Windows，2.x 使用 instance API）
  screen_brightness: ^2.1.11

  # 音量控制（多平台，3.x 使用 VolumeController.instance 单例 API）
  volume_controller: ^3.7.1

  # 保持屏幕常亮
  wakelock_plus: ^1.2.5

  # 桌面窗口管理（双击全屏，仅 Windows/macOS/Linux 生效）
  window_manager: ^0.5.2

  # 日期时间格式化
  intl: ^0.19.0

  # 网络请求（拉取播放列表/EPG）
  http: ^1.2.1

  # XML 解析（XMLTV 格式 EPG）
  xml: ^6.5.0

  # gzip 解压（.gz 压缩的 EPG 文件）
  archive: ^4.0.2

  # 本地持久化（保存播放列表/EPG 源配置）
  shared_preferences: ^2.2.3

  # 文件路径（录制/截图保存目录）
  path_provider: ^2.1.3

  # 文件选择器（选择本地播放列表文件）
  file_picker: ^13.1.0

  # 多编码解码（部分国内直播源 TXT 为 GBK/ANSI 编码，纯 Dart 全平台兼容）
  fl_charset: ^1.0.2

  # 二维码（设置页展示局域网管理地址，手机扫码编辑直播源/EPG）
  qr_flutter: ^4.1.0

  # 网页频道（TVBox 源里的 webview:// 链接）：Windows/Android/macOS/Web
  # 内嵌网页控件；Linux 回退 url_launcher 打开系统浏览器
  flutter_inappwebview: ^6.1.5

  # 系统浏览器兜底（非 Windows / 无 WebView2 时打开网页频道）
  url_launcher: ^6.3.0

  # 集合工具（firstOrNull 等）
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - branding/icon_1024.png
