name: omplayer
description: A cross-platform Flutter live streaming media player.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 视频播放 - 支持 HLS/DASH 直播流，跨平台
  video_player: ^2.8.6
  video_player_android: ^2.4.16
  video_player_avfoundation: ^2.6.1
  video_player_web: ^2.3.1

  # 状态管理
  provider: ^6.1.2

  # 屏幕亮度控制 (iOS/Android/Windows)
  screen_brightness: ^1.0.1

  # 音量控制 (iOS/Android)
  volume_controller: ^2.0.7

  # 保持屏幕常亮
  wakelock_plus: ^1.2.5

  # 日期时间格式化
  intl: ^0.19.0

  # 设备信息/平台判断
  device_info_plus: ^10.1.0

  # 网络请求（拉取播放列表/EPG）
  http: ^1.2.1

  # XML 解析（XMLTV 格式 EPG）
  xml: ^6.5.0

  # 本地持久化（保存播放列表/EPG 源配置）
  shared_preferences: ^2.2.3

  # 文件路径（录制/截图保存目录）
  path_provider: ^2.1.3

  # 文件选择器（选择本地播放列表文件）
  file_picker: ^8.0.3

  # 截图
  screenshot: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
