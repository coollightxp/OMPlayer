name: omplayer
description: A cross-platform Flutter live streaming media player.
publish_to: 'none'
version: 1.0.167+168

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 视频播放 - 支持 HLS/DASH 直播流，跨平台
  video_player: ^2.8.6
  video_player_android: ^2.4.16
  video_player_avfoundation: ^2.6.1
  video_player_web: ^2.3.1

  # Windows/Linux 视频播放后端（video_player 官方不支持桌面，fvp 基于 MDK 提供实现）
  fvp: ^0.38.1

  # 状态管理
  provider: ^6.1.2

  # 屏幕亮度控制（Android/iOS/macOS/Windows，2.x 使用 instance API）
  screen_brightness: ^2.1.11

  # 音量控制（多平台，3.x 使用 VolumeController.instance 单例 API）
  volume_controller: ^3.7.1

  # 保持屏幕常亮
  wakelock_plus: ^1.2.5

  # 桌面窗口管理（双击全屏，仅 Windows/macOS/Linux 生效）
  window_manager: ^0.5.2

  # 日期时间格式化
  intl: ^0.19.0

  # 网络请求（拉取央视频 EPG）
  http: ^1.2.1

  # 本地持久化（保存设置/收藏/上次播放频道）
  shared_preferences: ^2.2.3

  # 文件路径（录制/截图保存目录）
  path_provider: ^2.1.3

  # 网页频道：Windows/Android/macOS/Web 内嵌网页控件；
  # Linux 回退 url_launcher 打开系统浏览器
  flutter_inappwebview: ^6.1.5

  # 系统浏览器兜底（非 Windows / 无 WebView2 时打开网页频道）
  url_launcher: ^6.3.0

  # FFI 基础库（web_env 用其 calloc 调 WebView2Loader.dll 官方检测接口）
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - branding/icon_1024.png
    - branding/splash.jpg
    - assets/logos/
